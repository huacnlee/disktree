[package]
name = "disktree-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
keywords = ["nshm"]
publish = false

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "f67b502786c126a9c327de34635596176d17882f" }
serde_json = "1"
rustc-hash = "2"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
libc = "0.2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
