[package]
name = "disktree"
version = "0.1.6"
edition = "2024"
license = "MIT"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["rc"] }
rustc-hash = "2"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
libc = "0.2"
nsh-core = "0.4.0"
nsh-base = { version = "0.4.0", default-features = false }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", default-features = false }

# Keep filesystem scanning fast when launching with `cargo run` too.
[profile.dev.package.disktree]
opt-level = 3

# Keep interaction dependencies fast without disabling debug checks.
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.objc2]
opt-level = 3
[profile.dev.package.objc2-encode]
opt-level = 3
