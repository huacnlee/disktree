[package]
name = "disktree"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh.git", branch = "main" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh.git", branch = "main" }
